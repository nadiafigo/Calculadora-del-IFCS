name: e2e

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      # playwright.config.js levanta el sitio estático (python -m http.server) en este puerto
      # cuando CI está definido; ver la sección webServer del config.
      BASE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium

      # prod-smoke está etiquetado @prod: corre contra producción y se lanza a mano
      # (npm run test:prod-smoke), no en cada PR.
      - name: Pruebas e2e (sin @prod)
        run: npx playwright test --grep-invert @prod

      - name: Guardar reporte si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-resultados
          path: test-results/
          retention-days: 7
